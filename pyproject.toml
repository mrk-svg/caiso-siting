[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caiso-siting"
version = "1.7.1"
description = "Free-data CAISO interconnection node intelligence: queue + Cluster 15 + POI availability + parcels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Robert Karimov" }]
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "requests>=2.31", "tabulate>=0.9",
                "urllib3>=2.7.0", "idna>=3.15",
                "numpy>=1.24"]  # floors for PYSEC-2026-141/142 and PYSEC-2026-215

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
caiso-siting = "caiso_siting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
caiso_siting = ["vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# nodes.py and site.py carry HTML/markdown templates as string literals; diff.py/parcels.py have wide report lines
"src/caiso_siting/nodes.py" = ["E501"]
"src/caiso_siting/site.py" = ["E501"]
"src/caiso_siting/diff.py" = ["E501"]
"src/caiso_siting/parcels.py" = ["E501"]
"src/caiso_siting/layers.py" = ["E501"]
"src/caiso_siting/wdat.py" = ["E501"]
"src/caiso_siting/watch.py" = ["E501"]
"tests/test_watch.py" = ["E501", "E731"]
"src/caiso_siting/survival.py" = ["E501"]
"src/caiso_siting/oasis.py" = ["E501"]
"src/caiso_siting/eia860.py" = ["E501"]
"tests/test_oasis.py" = ["E501"]
"tests/test_eia860.py" = ["E501"]
