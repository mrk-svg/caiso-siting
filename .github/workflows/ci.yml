name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves under an unattended job; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .[dev]

      - name: Lint
        run: ruff check src tests

      # No exit-code-5 escape hatch. An empty collection used to mean "tests not written yet";
      # with a real suite it would mean "collection broke and CI went green anyway".
      - name: Test
        run: python -m pytest -q

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves under an unattended job; bump deliberately
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install
        run: pip install pip-audit

      # Audit the DECLARED dependencies, not the installed environment. `pip install -e .` puts this
      # project itself in the environment, and pip-audit cannot look up a local editable
      # distribution on PyPI — under --strict that unresolvable entry is an error, so auditing the
      # environment fails every run regardless of whether any real advisory exists.
      # requirements.txt is kept in step with pyproject by tests/test_packaging.py.
      - name: Audit declared dependencies
        run: pip-audit --strict --progress-spinner off -r requirements.txt
