name: weekly

on:
  schedule:
    - cron: "0 14 * * 1"   # every Monday 14:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      run_date: ${{ steps.stamp.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Stamp
        id: stamp
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # `caiso-siting download` exits 1 if either CAISO file fails to fetch, which fails the job.
      # No silent fallback to stale data: a stale snapshot would produce an empty, misleading diff.
      - name: Download CAISO reports
        run: caiso-siting download

      # queue -> cluster15 -> nodes -> snapshot -> diff -> site, in that order (see cli.weekly)
      - name: Weekly pipeline
        run: caiso-siting weekly

      - name: Commit snapshot, outputs and site
        id: commit
        env:
          RUN_DATE: ${{ steps.stamp.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every run re-stamps pipeline_run in 300+ files, so "did anything change" cannot be answered by
          # git diff. The snapshot directory is named by CAISO's report run date: if that directory is already
          # tracked, CAISO has not published a new file since the last run and there is nothing to record.
          latest=$(ls -d data/snapshots/*/ | sort | tail -1)
          if git ls-files --error-unmatch "${latest}projects.csv" >/dev/null 2>&1; then
            echo "CAISO run date $(basename "${latest}") already snapshotted; no new data, skipping commit"
            echo "new_snapshot=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "new_snapshot=true" >> "$GITHUB_OUTPUT"
          # quoted pathspecs: git expands them and silently skips .gitignore'd files
          # (raw xlsx snapshots, outputs/projects_all.csv, outputs/cluster15_projects.csv)
          git add -- 'data/snapshots/*/projects.csv' 'outputs/*.csv' 'outputs/*.md' 'outputs/nodes_map.html' site
          git commit -m "weekly: ${RUN_DATE} snapshot (CAISO run date $(basename "${latest}")) + site"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Only when CAISO published something new: otherwise diff_latest.md still describes last week's changes
      # and this step would open a fresh issue with a new date and stale content every Monday.
      - name: Open or update the weekly diff issue
        if: steps.commit.outputs.new_snapshot == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          RUN_DATE: ${{ steps.stamp.outputs.date }}
        with:
          script: |
            const fs = require('fs');
            const path = 'outputs/diff_latest.md';
            if (!fs.existsSync(path)) { core.info('no diff_latest.md (first snapshot); no issue'); return; }
            let body = fs.readFileSync(path, 'utf8');
            // "more than the header": a "## Changes (N)" section with N > 0; if the marker is
            // missing for any reason, fall back to "more than a title line".
            const m = body.match(/^## Changes \((\d+)\)/m);
            const nontrivial = m ? Number(m[1]) > 0 : body.trim().split('\n').length > 1;
            if (!nontrivial) { core.info('diff has no row-level changes; no issue'); return; }
            const LIMIT = 60000;
            if (body.length > LIMIT) {
              const note = '\n\n_…truncated: the full diff is in outputs/diff_latest.md in the repository._';
              body = body.slice(0, LIMIT - note.length) + note;
            }
            const title = `Weekly diff ${process.env.RUN_DATE}`;
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 });
            const existing = open.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info(`updated issue #${existing.number}`);
            } else {
              const r = await github.rest.issues.create({ owner, repo, title, body, labels: ['weekly-diff'] });
              core.info(`opened issue #${r.data.number}`);
            }

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
# touched after first push so GitHub registers the workflow_dispatch trigger
