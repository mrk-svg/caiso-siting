name: Bug in the code
description: The pipeline crashes, produces malformed output, or behaves differently from the docs.
title: "bug: "
labels: ["bug"]
body:
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and confidentiality
      options:
        - label: >-
            Everything in this issue comes from a public source. It is not confidential to my
            employer or a client, and it is not information my employer or a client owns or has a
            claim to, including under an invention-assignment or work-for-hire agreement. I agree
            that material I contribute here may be used in this project under the MIT licence
            that covers its code.
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and output
      description: The exact command, and the traceback or wrong output. Redact nothing but paths.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.5.0 / 679cbd4"
    validations:
      required: true
