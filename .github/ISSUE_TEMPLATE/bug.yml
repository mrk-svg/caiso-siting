name: Bug in the code
description: The pipeline crashes, produces malformed output, or behaves differently from the docs.
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command and output
      description: The exact command, and the traceback or wrong output. Redact nothing but paths.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "v1.5.0 / 679cbd4"
    validations:
      required: true
